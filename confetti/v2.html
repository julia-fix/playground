  const oldX = strength*(g.radius*Math.cos(angle)+1.3*Math.sin(2*angle+g.twist))
  const oldY = strength*(g.lift*Math.sin(angle)+2*Math.cos(2*angle+g.twist))
  if(g.x<20 && g.y===14) return [sway+oldX,bob+oldY]
  const rx = -distance, ry = g.y-23-1.3*Math.sin(4*t)
  const reach = Math.hypot(rx,ry)
  const u = Math.max(0,1-(reach/24)**2)
  const w = u*u
  const turn = w*(1.65+.45*Math.sin(5*t)+.46*Math.sin(angle))
  const c = Math.cos(turn), s = Math.sin(turn)
  const spiralX = rx*c-ry*s, spiralY = rx*s+ry*c
  const drift = angle+.48*Math.sin(2*angle+g.twist)
  const scatter = w*(4+1.45*g.radius)*(1+.22*Math.sin(3*angle))
  const dx = spiralX-rx+.45*w*spiralX+scatter*Math.cos(drift)
  const dy = spiralY-ry+.45*w*spiralY+scatter*Math.sin(drift)
  const sideRoom = Math.min(1,(Math.min(g.x,164-g.x)+5)/15)
  return [sway+sideRoom*dx+.12*oldX,bob+dy+.12*oldY]
}

const groups = batch.map(([x, y, width, phase, twist, spin, radius, lift, ...dots]) =>
  ({ x, y, width, phase, twist, spin, radius, lift, dots, offset: [0, 0] }))
const particles = []
for (const group of groups) {
  for (let i = 0; i < group.dots.length; i += 4) {
    const [x, y, radius, color] = group.dots.slice(i, i + 4)
    particles.push({ group, x, y, radius, color: palette[color] })
  }
}
// Upper disks cast their shadows on the disks below them.
particles.sort((a, b) => b.y - a.y)

const canvas = document.querySelector('canvas')
const ctx = canvas.getContext('2d')
const pref = matchMedia('(prefers-reduced-motion:reduce)')
let raf = 0

function render(now) {
  cancelAnimationFrame(raf)
  const width = Math.max(1, Math.round(canvas.clientWidth * Math.min(devicePixelRatio, 2)))
  const height = Math.max(1, Math.round(width * 82 / 208))
  if (width !== canvas.width || height !== canvas.height) {
    canvas.width = width
    canvas.height = height
  }
  ctx.setTransform(width / 208, 0, 0, height / 82, 22 * width / 208, 18 * height / 82)
  ctx.clearRect(-22, -18, 208, 82)
  const frame = now % 8000 / 8000 * frames
  for (const group of groups) {
    group.offset = pref.matches ? [0, 0] : motion(group, frame)
  }
  for (const dot of particles) {
    const x = dot.x + dot.group.offset[0]
    const y = dot.y + dot.group.offset[1]
    ctx.beginPath()
    ctx.fillStyle = '#000'
    ctx.arc(x - dot.radius * 0.08, y + dot.radius * 0.4, dot.radius, 0, tau)
    ctx.fill()
    ctx.beginPath()
    ctx.fillStyle = dot.color
    ctx.arc(x, y, dot.radius, 0, tau)
    ctx.fill()
  }
  if (!pref.matches && !document.hidden) raf = requestAnimationFrame(render)
}

function restart() { render(performance.now()) }
new ResizeObserver(restart).observe(canvas)
pref.addEventListener('change', restart)
document.addEventListener('visibilitychange', restart)
restart()
</script></html>
