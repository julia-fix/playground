.header__cities::before {

.header__link {

.header__link:hover {

}

.header-menu {
    position: relative;
}

.header-menu .header__link {
    display: none;
}

.header.show .header-menu {

}

.header.show .header-menu__list {

}

.header-menu__wrapper {

}

.header-menu__btn {
    display: none;
    justify-content: center;
    align-items: center;
    width: 40px;
    height: 54px;
    z-index: 999;
    right: 27px;
    bottom: 20px;

}

.header-menu__btn span {
    position: relative;
    display: block;
    width: 100%;
    height: 4px;
    border-radius: 3px;
    background-color: #27814e;
    transition: background-color .1s ease-in .2s;
}

.header-menu__btn span::before,
.header-menu__btn span::after {
    content: "";
    position: absolute;
    left: 0;
    background-color: #27814e;
    width: 100%;
    height: 4px;
    border-radius: 3px;
    top: -12px;
    transition: transform .2s ease-in, background-color .3s ease, .2s top .2s linear;
}

.header-menu__btn span::after {
    top: 12px;
}

.header-menu__btn.active {

.header-menu__list {
    width: 100%;

    margin-bottom: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
}

.header-menu__item {
    position: relative;
    display: flex;
    transition: background-color .3s ease;
}

.inner-menu__link span span {
    display: none;
}

.header-menu__item:last-child {
    margin-right: 0;
}

.header-menu__item:hover {
    background-color: #27814e;
    transition: background-color .3s ease;
    cursor: pointer;
}

.header-menu__item:hover .header-menu__link {
    color: #fff;
}

.header-menu__item:hover>.inner-menu {
    height: auto;
    width: 705px;
    background-color: #fff;
    z-index: 10;
    opacity: 1;
    padding: 21px;
    transition: opacity .5s ease;
}

.header-menu__item.active {
    background-color: #27814e;
}

.header-menu__item.active .header-menu__link {
    color: #fff;
}

.header-menu__link {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 7px 17px;
    border: 1px solid #77706f;
    font: 500 16px / 1.4 "Gilroy Medium", sans-serif;
    color: #222;
    text-align: center;
}

.inner-menu {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    height: 0;
    z-index: -1;
    opacity: 0;
    width: 0;
    overflow: hidden;
    position: absolute;
    top: 100%;
    left: -1px;
    background-color: #fff;
    box-shadow: -11px 17px 25px 0 rgba(0, 0, 0, 0.25);
    transition: opacity .5s ease;
}

.inner-menu:hover {
    height: auto;
    z-index: 1;
    opacity: 1;
    transition: opacity .5s ease;
}

.inner-menu li {
    list-style: none;
    display: flex;
    width: calc(50% - 9px);
    margin-right: 18px;
    margin-bottom: 11px;
}

.inner-menu li:nth-child(even) {
    margin-right: 0px;
}

.inner-menu__link {
    display: flex;
    justify-content: flex-start;
    background-color: #f1f1f1;
    flex-grow: 1;
    text-decoration: none;
    transition: background-color .3s ease;
}

.inner-menu__link span {

    font-size: 16px;
    line-height: 1.2;
    color: #272727;
    padding: 5px 15px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    transition: color .3s ease;
}

.inner-menu__link div {

    flex-shrink: 0;
    min-height: 50px;
    background-color: #27814e;
    display: flex;
    justify-content: center;
    align-items: center;
}

.inner-menu__link div:has(img) {

}

.inner-menu--simple .inner-menu__link div {
    background-color: #f1f1f1;
}

.inner-menu__link img {

}

.inner-menu--simple .inner-menu__link img {

}

.inner-menu__link:hover {
    background-color: #27814e;

}

.inner-menu__link:hover span {

.inner-menu__footer {

    justify-content: center;
    align-items: center;
    padding: 5px;
    transition: background-color .3s ease;
}

.inner-menu__footer li:nth-child(even) {

}

.inner-menu__footer li:nth-child(odd) {

}

.inner-menu__footer li:first-child {

    border-left: 1px solid #27814e;
    background-color: #27814e;
}

.inner-menu__footer li:first-child:hover {
    background-color: #fff;
    transition: background-color .3s ease;
}

.inner-menu__footer li:first-child:hover span {
    color: #27814e;
    transition: color .3s ease;
}

.inner-menu__footer-link {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
}

.inner-menu__footer-link span {

    font-weight: 400;

.inner-menu__footer li:first-child span {

    .header-menu__item:last-child {

    .header-menu__item.active::after {

    .header-menu__item:hover .header-menu__link {

  header.setAttribute('aria-label', 'Шапка с логотипом версии ' + (i + 1))
  const frame = header.querySelector('iframe')

  const menu = header.querySelector('nav')
  menu.id = 'menu-' + (i + 1)
  const button = header.querySelector('button.header-menu__btn')
  button.setAttribute('aria-controls', menu.id)
  button.addEventListener('click', () => {
    const open = header.toggleAttribute('data-menu-open')
    button.setAttribute('aria-expanded', String(open))
    button.setAttribute('aria-label', open ? 'Закрыть меню' : 'Открыть меню')
  })
  main.append(header)
}
